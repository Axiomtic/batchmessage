  height: 100%;

  height: 14px;

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {

.form-check:not(.form-switch) .form-check-input:disabled {

  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {

}

.form-switch .form-check-input:disabled,

.form-check-label {

.form-switch .form-check-input {

  height: 20px;

  background: var(--muted);
  box-shadow: none;

.form-switch .form-check-input::before {

  top: 50%;
  left: 0;

  height: 16px;

  box-shadow: var(--shadow-sm);

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

.form-range::-moz-range-track {

    &lt;section class=&quot;sms-panel sms-template-panel&quot; aria-labelledby=&quot;sms-template-heading&quot;&gt;

        &lt;div class=&quot;sms-section-title&quot; id=&quot;sms-review-heading&quot;&gt;待发送短信 &lt;span class=&quot;sms-count&quot; data-role=&quot;message-count&quot;&gt;2 条&lt;/span&gt;&lt;/div&gt;

          &lt;button type=&quot;button&quot; data-action=&quot;sync-all&quot;&gt;&lt;i data-lucide=&quot;refresh-cw&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 全部同步&lt;/button&gt;

        &lt;div class=&quot;sms-dialog-actions&quot;&gt;
          &lt;button type=&quot;button&quot; data-action=&quot;cancel-import&quot;&gt;取消&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;sms-dialog-confirm&quot; data-action=&quot;confirm-import&quot;&gt;覆盖并导入&lt;/button&gt;

    &lt;section class=&quot;sms-manager&quot; aria-label=&quot;模板管理页面&quot;&gt;
      &lt;header class=&quot;sms-manager-top&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;sms-icon-button&quot; aria-label=&quot;返回主页面&quot; data-action=&quot;close-manager&quot;&gt;&lt;i data-lucide=&quot;arrow-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
        &lt;div class=&quot;sms-title&quot;&gt;模板管理&lt;/div&gt;
      &lt;/header&gt;
      &lt;div class=&quot;sms-manager-main&quot;&gt;
        &lt;div class=&quot;sms-template-list&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;sms-template-choice is-selected&quot;&gt;服务到期提醒&lt;/button&gt;
        &lt;/div&gt;
        &lt;textarea class=&quot;sms-manager-editor&quot; aria-label=&quot;编辑所选模板&quot;&gt;您好，{名字}，您的服务将于{服务到期日期}到期，请及时办理续期。如已办理，请忽略本短信。&lt;/textarea&gt;
      &lt;/div&gt;
      &lt;div class=&quot;sms-manager-actions&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;sms-delete-template&quot; data-action=&quot;delete-template&quot;&gt;删除&lt;/button&gt;
        &lt;button type=&quot;button&quot; data-action=&quot;manager-save-as&quot;&gt;另存为&lt;/button&gt;
        &lt;button type=&quot;button&quot; class=&quot;sms-primary-action&quot; data-action=&quot;manager-overwrite&quot;&gt;覆盖保存&lt;/button&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;div class=&quot;sms-toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;sms-workbench-prototype&#x27;);
  if (!root) return;

  const state = {
    headers: [&#x27;名字&#x27;, &#x27;电话&#x27;, &#x27;服务到期日期&#x27;],
    rows: [
      [&#x27;张三&#x27;, &#x27;13800138000&#x27;, &#x27;2026-09-30&#x27;],
      [&#x27;李四&#x27;, &#x27;13900139000&#x27;, &#x27;2026-10-15&#x27;],
      [&#x27;&#x27;, &#x27;&#x27;, &#x27;&#x27;],
      [&#x27;&#x27;, &#x27;&#x27;, &#x27;&#x27;],
      [&#x27;&#x27;, &#x27;&#x27;, &#x27;&#x27;]
    ],
    messages: [],
    pendingImport: null
  };

  const grid = root.querySelector(&#x27;.sms-grid&#x27;);
  const messageList = root.querySelector(&#x27;.sms-message-list&#x27;);
  const templateEditor = root.querySelector(&#x27;.sms-template-editor&#x27;);
  const managerEditor = root.querySelector(&#x27;.sms-manager-editor&#x27;);
  const overwriteDialog = root.querySelector(&#x27;[data-role=&quot;overwrite-dialog&quot;]&#x27;);
  const overflowMenu = root.querySelector(&#x27;.sms-overflow-menu&#x27;);
  const manager = root.querySelector(&#x27;.sms-manager&#x27;);
  const toast = root.querySelector(&#x27;.sms-toast&#x27;);
  let toastTimer;

  function escapeHtml(value) {
    return String(value ?? &#x27;&#x27;)
      .replaceAll(&#x27;&amp;&#x27;, &#x27;&amp;amp;&#x27;)
      .replaceAll(&#x27;&lt;&#x27;, &#x27;&amp;lt;&#x27;)
      .replaceAll(&#x27;&gt;&#x27;, &#x27;&amp;gt;&#x27;)
      .replaceAll(&#x27;&quot;&#x27;, &#x27;&amp;quot;&#x27;)
      .replaceAll(&quot;&#x27;&quot;, &#x27;&amp;#039;&#x27;);
  }

  function rowHasData(row) {
    return row.some(cell =&gt; String(cell).trim() !== &#x27;&#x27;);
  }

  function getPhone(row) {
    const phoneIndex = state.headers.findIndex(header =&gt; header === &#x27;电话&#x27;);
    return phoneIndex &gt;= 0 ? String(row[phoneIndex] || &#x27;&#x27;) : &#x27;&#x27;;
  }

  function renderTemplate(row) {
    const values = Object.fromEntries(state.headers.map((header, index) =&gt; [header, row[index] || &#x27;&#x27;]));
    return templateEditor.value.replace(/\{([^{}]+)\}/g, (match, key) =&gt; Object.prototype.hasOwnProperty.call(values, key) ? values[key] : match);
  }

  function contentUnits(value) {
    return Array.from(String(value ?? &#x27;&#x27;)).reduce((total, character) =&gt; total + (/[^\u0000-\u00ff]/.test(character) ? 2 : 1), 0);
  }

  function calculateColumnWidth(columnIndex) {
    const candidates = [state.headers[columnIndex], ...state.rows.map(row =&gt; row[columnIndex] || &#x27;&#x27;)];
    const longest = Math.max(...candidates.map(contentUnits), 1);
    return Math.min(240, Math.max(76, Math.ceil(longest * 7.2 + 24)));
  }

  function refreshColumnWidths() {
    const widths = state.headers.map((_, index) =&gt; calculateColumnWidth(index));
    grid.querySelectorAll(&#x27;col[data-column-index]&#x27;).forEach(column =&gt; {
      const index = Number(column.dataset.columnIndex);
      column.style.width = `${widths[index]}px`;
    });
    const availableWidth = grid.parentElement ? grid.parentElement.clientWidth - 2 : 0;
    grid.style.width = `${Math.max(38 + widths.reduce((sum, width) =&gt; sum + width, 0), availableWidth)}px`;
  }

  function renderGrid() {
    const columnDefinitions = state.headers.map((_, index) =&gt; `&lt;col data-column-index=&quot;${index}&quot;&gt;`).join(&#x27;&#x27;);
    const columns = state.headers.map((header, index) =&gt; `&lt;th contenteditable=&quot;true&quot; data-header-index=&quot;${index}&quot;&gt;${escapeHtml(header)}&lt;/th&gt;`).join(&#x27;&#x27;);
    const rows = state.rows.map((row, rowIndex) =&gt; {
      const cells = state.headers.map((_, columnIndex) =&gt; `&lt;td contenteditable=&quot;true&quot; data-row-index=&quot;${rowIndex}&quot; data-column-index=&quot;${columnIndex}&quot;&gt;${escapeHtml(row[columnIndex] || &#x27;&#x27;)}&lt;/td&gt;`).join(&#x27;&#x27;);
      return `&lt;tr&gt;&lt;td class=&quot;sms-row-number&quot;&gt;${rowIndex + 1}&lt;/td&gt;${cells}&lt;/tr&gt;`;
    }).join(&#x27;&#x27;);
    grid.innerHTML = `&lt;colgroup&gt;&lt;col style=&quot;width:38px&quot;&gt;${columnDefinitions}&lt;/colgroup&gt;&lt;thead&gt;&lt;tr&gt;&lt;th class=&quot;sms-row-number&quot;&gt;#&lt;/th&gt;${columns}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows}&lt;/tbody&gt;`;
    refreshColumnWidths();
  }

  function updateMessages() {
    const activeRows = state.rows.filter(rowHasData);
    const unsynced = state.messages.filter(message =&gt; !message.sync);
    const synced = activeRows.map((row, index) =&gt; ({
      id: `row-${index}`,
      phone: getPhone(row),
      text: renderTemplate(row),
      sync: true
    }));
    state.messages = [...synced, ...unsynced.filter(message =&gt; !synced.some(item =&gt; item.id === message.id))];
    renderMessages();
  }

  function renderMessages() {
    messageList.innerHTML = state.messages.map((message, index) =&gt; `
      &lt;article class=&quot;sms-message-item&quot; data-message-index=&quot;${index}&quot;&gt;
        &lt;div class=&quot;sms-message-meta&quot;&gt;
          &lt;span class=&quot;sms-phone-number&quot;&gt;${escapeHtml(message.phone || &#x27;未填写手机号&#x27;)}&lt;/span&gt;
          &lt;label class=&quot;sms-sync-label&quot;&gt;&lt;input type=&quot;checkbox&quot; data-action=&quot;toggle-sync&quot; data-message-index=&quot;${index}&quot; ${message.sync ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;与表同步&lt;/label&gt;
        &lt;/div&gt;
        &lt;textarea class=&quot;sms-message-editor&quot; aria-label=&quot;编辑发给 ${escapeHtml(message.phone || &#x27;未填写手机号&#x27;)} 的短信&quot; data-message-index=&quot;${index}&quot;&gt;${escapeHtml(message.text)}&lt;/textarea&gt;
      &lt;/article&gt;`).join(&#x27;&#x27;);
    const countText = `${state.messages.length} 条`;
    root.querySelector(&#x27;[data-role=&quot;message-count&quot;]&#x27;).textContent = countText;
    root.querySelector(&#x27;[data-role=&quot;footer-count&quot;]&#x27;).textContent = String(state.messages.length);
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add(&#x27;is-visible&#x27;);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() =&gt; toast.classList.remove(&#x27;is-visible&#x27;), 1700);
  }

  function openImportDialog(source) {
    state.pendingImport = source;
    overwriteDialog.classList.add(&#x27;is-open&#x27;);
    overwriteDialog.setAttribute(&#x27;aria-hidden&#x27;, &#x27;false&#x27;);
  }

  function closeImportDialog() {
    overwriteDialog.classList.remove(&#x27;is-open&#x27;);
    overwriteDialog.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
    state.pendingImport = null;
  }

  function applyImport() {
    if (state.pendingImport === &#x27;excel&#x27;) {
      state.headers = [&#x27;名字&#x27;, &#x27;电话&#x27;, &#x27;服务到期日期&#x27;];
      state.rows = [[&#x27;王五&#x27;, &#x27;13700137000&#x27;, &#x27;2026-11-20&#x27;], [&#x27;赵六&#x27;, &#x27;13600136000&#x27;, &#x27;2026-12-08&#x27;], [&#x27;&#x27;, &#x27;&#x27;, &#x27;&#x27;]];
    } else {
      state.headers = [&#x27;名字&#x27;, &#x27;电话&#x27;, &#x27;服务到期日期&#x27;];
      state.rows = [[&#x27;钱七&#x27;, &#x27;13500135000&#x27;, &#x27;2027-01-18&#x27;], [&#x27;孙八&#x27;, &#x27;13400134000&#x27;, &#x27;2027-02-26&#x27;], [&#x27;&#x27;, &#x27;&#x27;, &#x27;&#x27;]];
    }
    renderGrid();
    updateMessages();
    closeImportDialog();
    showToast(&#x27;已覆盖表格，同步短信已刷新&#x27;);
  }

  grid.addEventListener(&#x27;input&#x27;, event =&gt; {
    const cell = event.target.closest(&#x27;[data-row-index]&#x27;);
    if (cell) {
      state.rows[Number(cell.dataset.rowIndex)][Number(cell.dataset.columnIndex)] = cell.textContent;
      updateMessages();
      refreshColumnWidths();
      return;
    }
    const header = event.target.closest(&#x27;[data-header-index]&#x27;);
    if (header) {
      state.headers[Number(header.dataset.headerIndex)] = header.textContent.trim() || String(Number(header.dataset.headerIndex) + 1);
      updateMessages();
      refreshColumnWidths();
    }
  });

  messageList.addEventListener(&#x27;input&#x27;, event =&gt; {
    const editor = event.target.closest(&#x27;.sms-message-editor&#x27;);
    if (!editor) return;
    const index = Number(editor.dataset.messageIndex);
    state.messages[index].text = editor.value;
    state.messages[index].sync = false;
    const checkbox = messageList.querySelector(`input[data-message-index=&quot;${index}&quot;]`);
    if (checkbox) checkbox.checked = false;
  });

  messageList.addEventListener(&#x27;change&#x27;, event =&gt; {
    const toggle = event.target.closest(&#x27;[data-action=&quot;toggle-sync&quot;]&#x27;);
    if (!toggle) return;
    const index = Number(toggle.dataset.messageIndex);
    state.messages[index].sync = toggle.checked;
    if (toggle.checked) updateMessages();
  });

  templateEditor.addEventListener(&#x27;input&#x27;, updateMessages);

  root.addEventListener(&#x27;click&#x27;, event =&gt; {
    const actionButton = event.target.closest(&#x27;[data-action]&#x27;);
    if (!actionButton) return;
    const action = actionButton.dataset.action;

    if (action === &#x27;import-excel&#x27;) openImportDialog(&#x27;excel&#x27;);
    if (action === &#x27;import-clipboard&#x27;) openImportDialog(&#x27;clipboard&#x27;);
    if (action === &#x27;cancel-import&#x27;) closeImportDialog();
    if (action === &#x27;confirm-import&#x27;) applyImport();

    if (action === &#x27;add-row&#x27;) {
      state.rows.push(state.headers.map(() =&gt; &#x27;&#x27;));
      renderGrid();
      showToast(&#x27;已添加一行&#x27;);
    }
    if (action === &#x27;add-column&#x27;) {
      state.headers.push(String(state.headers.length + 1));
      state.rows.forEach(row =&gt; row.push(&#x27;&#x27;));
      renderGrid();
      updateMessages();
      showToast(&#x27;已添加一列&#x27;);
    }
    if (action === &#x27;delete-row&#x27; &amp;&amp; state.rows.length &gt; 1) {
      state.rows.pop();
      renderGrid();
      updateMessages();
      overflowMenu.classList.remove(&#x27;is-open&#x27;);
    }
    if (action === &#x27;delete-column&#x27; &amp;&amp; state.headers.length &gt; 1) {
      state.headers.pop();
      state.rows.forEach(row =&gt; row.pop());
      renderGrid();
      updateMessages();
      overflowMenu.classList.remove(&#x27;is-open&#x27;);
    }
    if (action === &#x27;clear-table&#x27;) {
      state.rows = Array.from({ length: 5 }, () =&gt; state.headers.map(() =&gt; &#x27;&#x27;));
      renderGrid();
      updateMessages();
      overflowMenu.classList.remove(&#x27;is-open&#x27;);
      showToast(&#x27;表格已清空&#x27;);
    }
    if (action === &#x27;toggle-overflow&#x27;) overflowMenu.classList.toggle(&#x27;is-open&#x27;);

    if (action === &#x27;sync-all&#x27;) {
      state.messages.forEach(message =&gt; { message.sync = true; });
      updateMessages();
      showToast(&#x27;所有短信已恢复与表同步&#x27;);
    }
    if (action === &#x27;unsync-all&#x27;) {
      state.messages.forEach(message =&gt; { message.sync = false; });
      renderMessages();
      showToast(&#x27;所有短信已取消同步&#x27;);
    }
    if (action === &#x27;overwrite-template&#x27;) showToast(&#x27;已覆盖保存当前模板&#x27;);
    if (action === &#x27;save-template-as&#x27;) showToast(&#x27;已另存为“服务到期提醒（副本）”&#x27;);
    if (action === &#x27;send&#x27;) showToast(&#x27;这里将进入最终发送确认&#x27;);

    if (action === &#x27;open-manager&#x27;) {
      managerEditor.value = templateEditor.value;
      manager.classList.add(&#x27;is-open&#x27;);
    }
    if (action === &#x27;close-manager&#x27;) manager.classList.remove(&#x27;is-open&#x27;);
    if (action === &#x27;manager-overwrite&#x27;) {
      templateEditor.value = managerEditor.value;
      updateMessages();
      showToast(&#x27;模板已覆盖保存&#x27;);
    }
    if (action === &#x27;manager-save-as&#x27;) showToast(&#x27;新模板已保存&#x27;);
    if (action === &#x27;delete-template&#x27;) showToast(&#x27;默认模板不能删除&#x27;);
  });

  renderGrid();
  updateMessages();
  if (&#x27;ResizeObserver&#x27; in window) {
    new ResizeObserver(refreshColumnWidths).observe(root.querySelector(&#x27;.sms-table-wrap&#x27;));
  }
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
